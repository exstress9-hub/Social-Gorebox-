name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project and copy sources
        run: |
          flutter create --platforms=android --project-name muhammetaly --org com.muhammetaly build_app
          cp app/*.dart build_app/lib/
      - name: Android permissions
        run: |
          M=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <application/' $M
      - name: Build
        run: cd build_app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Muhammetaly-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
